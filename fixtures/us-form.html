<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>US checkout</title>
  </head>
  <body>
    <form id="us-checkout" name="checkout">
      <fieldset>
        <legend>Billing address</legend>
        <label for="b-first">First Name</label>
        <input
          id="b-first"
          name="billing_first_name"
          type="text"
          autocomplete="billing given-name"
        />
        <label for="b-last">Last Name</label>
        <input
          id="b-last"
          name="billing_last_name"
          type="text"
          autocomplete="billing family-name"
        />
        <label for="b-addr1">Address Line 1</label>
        <input id="b-addr1" name="billing_address_1" type="text" />
        <label for="b-addr2">Address Line 2</label>
        <input id="b-addr2" name="billing_address_2" type="text" />
        <label for="b-city">City</label>
        <input id="b-city" name="billing_city" type="text" />
        <label for="b-state">State</label>
        <select id="b-state" name="billing_state">
          <option value="">Select…</option>
          <option value="TX">Texas</option>
          <option value="CA">California</option>
          <option value="NY">New York</option>
          <option value="WA">Washington</option>
        </select>
        <label for="b-zip">ZIP Code</label>
        <input id="b-zip" name="billing_postcode" type="text" autocomplete="billing postal-code" />
        <label for="b-phone">Phone</label>
        <input id="b-phone" name="billing_phone" type="tel" />
        <label for="b-email">Email Address</label>
        <input id="b-email" name="billing_email" type="email" />
      </fieldset>
      <label for="us-dob">Date of Birth</label>
      <input id="us-dob" name="date_of_birth" type="text" placeholder="MM/DD/YYYY" maxlength="10" />
      <button type="submit">Place order</button>
    </form>
  </body>
</html>

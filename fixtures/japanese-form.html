<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>お客様情報</title>
  </head>
  <body>
    <!--
      Japanese labels are NOT translated by the v0.1 dictionary:
      detection relies on autocomplete tokens and input types here,
      kanji-only fields are expected to end up as "needs review".
      This documents a known limitation on purpose.
    -->
    <form id="jp-form" name="jp_form">
      <label for="j-name">お名前（姓）</label>
      <input id="j-last" name="sei" type="text" autocomplete="family-name" />

      <label for="j-first">お名前（名）</label>
      <input id="j-first" name="mei" type="text" autocomplete="given-name" />

      <label for="j-email">メールアドレス</label>
      <input id="j-email" name="mail" type="email" autocomplete="email" />

      <label for="j-tel">電話番号</label>
      <input id="j-tel" name="denwa" type="tel" autocomplete="tel" />

      <label for="j-postal">郵便番号</label>
      <input id="j-postal" name="yubin" type="text" autocomplete="postal-code" />

      <label for="j-addr">住所</label>
      <input id="j-addr" name="jusho" type="text" autocomplete="street-address" />
    </form>
  </body>
</html>

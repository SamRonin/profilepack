<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>UK delivery details</title>
  </head>
  <body>
    <form id="uk-delivery" name="delivery_details">
      <label for="uk-first">First Name</label>
      <input id="uk-first" name="first_name" type="text" />
      <label for="uk-last">Surname</label>
      <input id="uk-last" name="surname" type="text" />
      <label for="uk-email">Email</label>
      <input id="uk-email" name="email" type="email" />
      <label for="uk-mobile">Mobile Number</label>
      <input id="uk-mobile" name="mobile_number" type="tel" />
      <label for="uk-addr1">Address Line 1</label>
      <input id="uk-addr1" name="address_line_1" type="text" />
      <label for="uk-addr2">Address Line 2 (optional)</label>
      <input id="uk-addr2" name="address_line_2" type="text" />
      <label for="uk-town">Town / City</label>
      <input id="uk-town" name="town" type="text" />
      <label for="uk-county">County</label>
      <input id="uk-county" name="county" type="text" />
      <label for="uk-postcode">Postcode</label>
      <input id="uk-postcode" name="postcode" type="text" />
      <label for="uk-company">Company Name</label>
      <input id="uk-company" name="company_name" type="text" />
      <button type="submit">Continue</button>
    </form>
  </body>
</html>

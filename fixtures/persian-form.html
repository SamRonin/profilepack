<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>فرم ثبت‌نام فارسی</title>
  </head>
  <body>
    <h1>ایجاد حساب کاربری</h1>
    <form id="signup_fa" name="signup_fa" action="/ثبت‌نام" method="post">
      <label for="fa-first">نام</label>
      <input id="fa-first" name="first_name_fa" type="text" />

      <label for="fa-last">نام خانوادگی</label>
      <input id="fa-last" name="last_name_fa" type="text" />

      <label for="fa-full">نام و نام خانوادگی</label>
      <input id="fa-full" name="full_name_fa" type="text" />

      <label for="fa-username">نام کاربری</label>
      <input id="fa-username" name="username_fa" type="text" />

      <label for="fa-email">ایمیل</label>
      <input id="fa-email" name="email_fa" type="email" />

      <label for="fa-mobile">شماره موبایل</label>
      <input id="fa-mobile" name="mobile_fa" type="tel" />

      <label for="fa-postal">کد پستی</label>
      <input id="fa-postal" name="postal_fa" type="text" />

      <label for="fa-address">نشانی</label>
      <input id="fa-address" name="address_fa" type="text" />

      <label for="fa-city">شهر</label>
      <input id="fa-city" name="city_fa" type="text" />

      <label for="fa-province">استان</label>
      <input id="fa-province" name="province_fa" type="text" />

      <label for="fa-company">شرکت</label>
      <input id="fa-company" name="company_fa" type="text" />

      <label for="fa-national-id">کد ملی</label>
      <input id="fa-national-id" name="national_id_fa" type="text" />

      <button type="submit">ثبت‌نام</button>
    </form>
  </body>
</html>
